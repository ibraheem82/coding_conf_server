
services:
  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-backend
    restart: always
    
    # HOST_PORT : CONTAINER_PORT
    # You will access via http://localhost:5347
    # Your app MUST listen on 9392 inside
    ports:
      - "5347:9392"
      
    env_file:
      - .env # Ensure this file has PORT=9392 and your Supabase DATABASE_URL
    
    # REMOVED "depends_on" because Supabase is always "on" in the cloud
    
  # REMOVED the "postgres" service block entirely
  # REMOVED "volumes" block entirely