services:
  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-backend
    restart: always
    ports:
      - "9392:9392"
    environment:
      - PORT=9392
      - NODE_ENV=production
      # Use the service name 'postgres' as the host
      - DATABASE_URL=postgres://postgres:password@postgres:5432/conference_db
      # Inject Cloudinary/Brevo keys here (or use an env_file)
      # - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      # - BREVO_API_KEY=${BREVO_API_KEY}
    env_file:
      - .env # Load local secrets during development/testing
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ticket-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: conference_db
    ports:
      - "5432:5432" # Optional: Expose 5432 to host for local tools
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
